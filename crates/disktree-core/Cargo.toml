[package]
name = "disktree-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Filesystem scanning and treemap layout for disktree"

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rayon = { workspace = true }
rustix = { version = "1.1", features = ["fs"] }
rustc-hash = { workspace = true }

# The mount table, the Finder's Trash and purgeable space; see `macos.rs`.
# All three are already in the graph through GPUI, so this adds no crates.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSFileManager",
    "NSString",
    "NSURL",
    "NSValue",
] }

[dev-dependencies]
tempfile = "3"
