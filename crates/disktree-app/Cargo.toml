[package]
name = "disktree-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GPUI treemap explorer for disk usage, in Omarchy's visual language"

[[bin]]
name = "disktree"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
gpui-kit = { version = "=0.6.6", default-features = false, features = ["assets"] }
gpui-omarchy = "0.1.3"
disktree-core = { workspace = true }
anyhow = { workspace = true }
dunce = "1.0.5"
rustc-hash = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
# The window harness: it lets the tests draw a real frame and press real keys.
gpui-kit = { version = "=0.6.6", default-features = false, features = [
    "assets",
    "test-support",
] }
tempfile = "3"
