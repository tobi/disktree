[package]
name = "disktree-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "GPUI treemap explorer for disk usage, in Omarchy's visual language"

[[bin]]
name = "pwrdisk"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
gpui-kit = { version = "=0.7.3", default-features = false, features = ["assets"] }
gpui-omarchy = "0.2.1"
disktree-core = { workspace = true }
disktree-link = { workspace = true }
disktree-mcp = { workspace = true }
anyhow = { workspace = true }
dunce = "1.0.5"
rustc-hash = { workspace = true }
tempfile = "3"
# Installer and auto-updater. Pinned with `=` because the `vpk` CLI that
# packs releases must be the same version: VPK_VERSION (and its SHA-512) in
# scripts/release/install-vpk.sh. Upgrade them together.
velopack = "=1.2.161"
# Velopack logs through `log`; the updater's own lines go there too, and
# diag_log.rs writes them all to main.log.
log = "0.4"
# The log's and the diagnostics' local times. Already in the tree.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Wakes the window when a background update check changes what it shows.
# Already in the tree through GPUI.
async-channel = "2"
# The release channel: SemVer precedence for picking each slot's release.
# Already in the tree through Velopack.
semver = "1"
# The release channel setting and the held download, as JSON, and the
# release list GitHub's API returns.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reads the published release list from GitHub's API, as PwrRoute does.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(target_os = "macos")'.dependencies]
# AppKit for the Dock icon of a run outside the app bundle (dock_icon.rs)
# and the screen under the pointer (placement.rs): the crates and versions
# GPUI already builds, with only the classes used.
objc2 = "0.6"
# The kernel release, which says which macOS this is whatever SDK linked it.
rustix = { version = "1.1", features = ["system"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSEvent",
    "NSGraphics",
    "NSImage",
    "NSResponder",
    "NSScreen",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSGeometry",
    "NSProcessInfo",
    "NSString",
    "NSValue",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
# The window harness: it lets the tests draw a real frame and press real keys.
gpui-kit = { version = "=0.7.3", default-features = false, features = [
    "assets",
    "test-support",
] }
